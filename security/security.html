<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Command Center | Security & Dean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../security/security.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .siren-flash { animation: sirenAlert 1s infinite alternate; }
        @keyframes sirenAlert {
            0% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
            100% { box-shadow: 0 0 60px rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div id="mainSiren" class="bg-red-500/20 p-2.5 rounded-xl border border-red-500/50 transition-all duration-300">
                <i class="fa-solid fa-building-shield text-red-500 text-2xl" id="sirenIcon"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-wide text-white">Security & Dean Command</h1>
                <p class="text-xs text-slate-400">Live SOS Monitoring System</p>
            </div>
        </div>
        <div class="flex gap-3">
            <span id="systemStatus" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-shield-check"></i> System Secure
            </span>
        </div>
    </nav>

    <!-- Main Dashboard -->
    <div class="flex-1 p-6 lg:p-10 max-w-7xl mx-auto w-full">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-extrabold text-white">Active Emergencies</h2>
                <p class="text-slate-400 mt-1 text-sm">Real-time alerts from campus students.</p>
            </div>
        </div>

        <!-- Alert Container -->
        <div id="sosContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full flex flex-col items-center justify-center py-20 opacity-50">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-red-500 mb-4"></i>
                <p class="font-medium text-slate-400">Connecting to Live Radar...</p>
            </div>
        </div>
    </div>

    <script type="module" src="../security/security.js"></script>
</body>
</html>
